system:
  repository_root: /home/hackdac/Desktop/intern/LLMorch
  max_agents: 4
  database: sqlite
  db_path: /home/hackdac/Desktop/intern/LLMorch/history/llmorch.db
  log_level: INFO

execution:
  max_agents: 4
  default_agent_count: auto
  default_agent: agent-agy-01
  enabled_agents:
    - agent-agy-01
    - agent-codex-01
    - agent-fourth-01

execution_policy:
  enabled_agents:
    - agent-agy-01
    - agent-codex-01
    - agent-fourth-01
  disabled_agents:
    - agent-claude-01
  allow_real_claude_execution: false
  allow_real_agy_execution: true
  allow_real_codex_execution: true


scheduler:
  max_concurrent_agents: 4

strategy:
  min_agents: 1
  allow_parallel: true
  escalate_on_uncertainty: true
  escalate_on_independent_confirmation_need: true
  stop_on_low_marginal_benefit: true
  max_retries_per_task: 2

security:
  allowed_repository_roots:
    - /home/hackdac/Desktop
    - /home/hackdac/Documents
    - /home/hackdac/Projects
    - /home/hackdac/Desktop/intern
    - /tmp

